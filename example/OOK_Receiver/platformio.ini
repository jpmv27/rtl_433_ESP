;  '-DRTL433_RF_MODULE_CS=5'      ; pin to be used as chip select
  '-DRTL433_RF_MODULE_GDO0=13'   ; CC1101 pin GDO0 - Breadboard is 22 versus 13 on soldered
  '-DRTL433_RF_MODULE_GDO2=4'    ; CC1101 pin GDO2
; '-DRTL433_RF_MODULE_INIT_STATUS'    ; Display transceiver config during startup
