monitor_port = /dev/cu.SLAB_USBtoUART
monitor_speed = 921600
upload_port = /dev/cu.SLAB_USBtoUART
upload_speed = 921600

[env:esp32_heltec]
board = heltec_wifi_lora_32_V2
build_flags = 
  '-DLOG_LEVEL=LOG_LEVEL_TRACE'
; *** rtl_433_ESP Options ***
  '-DRTL433_ONBOARD_LED=LED_BUILTIN'          ; Onboard LED is GPIO 25 on the Heltec Board
;  '-DRTL433_ALL_DECODER_VERBOSE=4'           ; rtl_433 verbose mode
;  '-DRTL433_DECODER_VERBOSE=58'          ; LaCrosse TX141-Bv2, TX141TH-Bv2, TX141-Bv3, TX141W, TX145wsdth sensor
;  '-DRTL433_RAW_SIGNAL_DEBUG'   ; display raw received messages
;  '-DRTL433_MEMORY_DEBUG'   ; display memory usage information
;  '-DRTL433_DEMOD_DEBUG'  ; display signal debug info
;  '-DRTL433_MY_DEVICES=TBD'		; subset of devices
;  '-DRTL433_PUBLISH_UNPARSED'   ; publish unparsed signal details
;  '-DRTL433_RSSI_THRESHOLD_DELTA=12'         ; Apply a delta of 12
;  '-DRTL433_OOK_FIXED_THRESHOLD=0x50'  ; Inital OOK Threhold - Only for SX127X
;  '-DRTL433_SIGNAL_RSSI'             ; Display during signal receive
; *** RF Module Options ***
;  '-DRTL433_RF_SX1278="SX1278"'   ; Heltec ESP 32 Module - module settings come from heltec_wifi_lora_32_V2/pins_arduino.h
;  '-DRTL433_RF_MODULE_DIO0=26'    ; SX1276 pin DIO0
;  '-DRTL433_RF_MODULE_DIO1=35'    ; SX1276 pin DIO1
;  '-DRTL433_RF_MODULE_DIO2=34'    ; SX1276 pin DIO2
;  '-DRTL433_RF_MODULE_RST=14'     ; pin to be used as hardware reset
;  '-DRTL433_RF_MODULE_INIT_STATUS'    ; Display transceiver config during startup
; *** Heltec module requires non-standard SPI Config ***
;  '-DRTL433_RF_MODULE_CS=18'      ; pin to be used as chip select
;  '-DRTL433_RF_MODULE_MOSI=27'
;  '-DRTL433_RF_MODULE_MISO=19'
;  '-DRTL433_RF_MODULE_SCK=5'
; *** RadioLib Options ***
;  '-DRADIOLIB_DEBUG=true'
;  '-DRADIOLIB_VERBOSE=true'
; *** Setting Testing ***
  ;'-DsetBitrate'
  ;'-DsetFrequencyDeviation'
  ;'-DsetRxBW'
monitor_port = /dev/cu.SLAB_USBtoUART
monitor_speed = 921600
upload_port = /dev/cu.SLAB_USBtoUART
upload_speed = 921600

