; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini32_sx1278
src_dir = .

[libraries]
arduinolog = https://github.com/1technophile/Arduino-Log.git#d13cd80
arduinojson = ArduinoJson@5.13.4
rtl_433_ESP = symlink://../../../rtl_433_ESP  ; Builds library from source directory

[env]
framework = arduino
monitor_filters = esp32_exception_decoder
platform = espressif32@6.1.0
lib_ldf_mode = chain+
lib_deps = 
	${libraries.arduinolog}
	${libraries.arduinojson}
    ${libraries.rtl_433_ESP}

[env:esp32_sx1278]
board = esp32dev
build_flags = 
  '-DLOG_LEVEL=LOG_LEVEL_TRACE'
; *** rtl_433_ESP Options ***
;  '-DRTL433_ONBOARD_LED=2'
  '-DRTL433_OOK_MODULATION=true'       ; False is FSK, True is OOK
;  '-DRTL433_ALL_DECODER_VERBOSE=4'           ; rtl_433 verbose mode
;  '-DRTL433_DEMOD_DEBUG'  ; display signal debug info
  '-DRTL433_RSSI_THRESHOLD_DEBUG=true'
  '-DRTL433_MY_DEVICES=RTL433_MY_DEVICES_ECOWITT_INFACTORY_S3318P'		; subset of devices
  '-DRTL433_RSSI_THRESHOLD=-82'
; *** RF Module Options ***
  '-DRTL433_RF_SX1278="SX1278"'
  '-DRTL433_RF_MODULE_DIO0=15'
  '-DRTL433_RF_MODULE_DIO1=4'
  '-DRTL433_RF_MODULE_DIO2=16'
  '-DRTL433_RF_MODULE_RST=17'
  '-DRTL433_RF_MODULE_CS=5'
  '-DRTL433_RF_MODULE_MOSI=23'
  '-DRTL433_RF_MODULE_MISO=19'
  '-DRTL433_RF_MODULE_SCK=18'
  '-DRTL433_RF_MODULE_INIT_STATUS'    ; Display transceiver config during startup
; *** RadioLib Options ***
;  '-DRADIOLIB_DEBUG=true'
;  '-DRADIOLIB_VERBOSE=true'
upload_protocol = esptool
upload_port = /dev/ttyUSB0
monitor_speed = 921600
monitor_port = /dev/ttyUSB0

[env:d1_mini32_sx1278]
board = wemos_d1_mini32
lib_deps =
  ${env.lib_deps}
  elog = https://github.com/jpmv27/elog.git#jpmv27_master
build_flags = 
  '-DLOG_LEVEL=LOG_LEVEL_TRACE'
; *** rtl_433_ESP Options ***
  '-DRTL433_ELOG_TO_SERIAL'
  '-DRTL433_ELOG_TO_SYSLOG'
  '-DRTL433_ONBOARD_LED=2'
  '-DRTL433_OOK_MODULATION=true'       ; False is FSK, True is OOK
;  '-DRTL433_ALL_DECODER_VERBOSE=4'           ; rtl_433 verbose mode
;  '-DRTL433_DEMOD_DEBUG'  ; display signal debug info
  '-DRTL433_MY_DEVICES=RTL433_MY_DEVICES_ECOWITT_INFACTORY_S3318P'		; subset of devices
  '-DRTL433_RSSI_THRESHOLD=-82'
; *** RF Module Options ***
  '-DRTL433_RF_SX1278="SX1278"'
  '-DRTL433_RF_MODULE_DIO0=18'
  '-DRTL433_RF_MODULE_DIO1=19'
  '-DRTL433_RF_MODULE_DIO2=23'
  '-DRTL433_RF_MODULE_RST=26'
  '-DRTL433_RF_MODULE_CS=22'
  '-DRTL433_RF_MODULE_MOSI=21'
  '-DRTL433_RF_MODULE_MISO=17'
  '-DRTL433_RF_MODULE_SCK=16'
  '-DRTL433_RF_MODULE_INIT_STATUS'    ; Display transceiver config during startup
; *** RadioLib Options ***
;  '-DRADIOLIB_DEBUG=true'
;  '-DRADIOLIB_VERBOSE=true'
;
  '-DELOG_SYSLOG_ENABLE'
upload_protocol = esptool
upload_port = /dev/ttyACM0
monitor_speed = 921600
monitor_port = /dev/ttyACM0

[env:esp32c3_cdc_cc1101]
platform = espressif32
board = airm2m_core_esp32c3
build_flags =
  '-DCONFIG_ESP_CONSOLE_UART=1'	; settings for esp32c3 without uart
  '-DARDUINO_USB_MODE=1'
  '-DARDUINO_USB_CDC_ON_BOOT=1'
  '-DLOG_LEVEL=LOG_LEVEL_TRACE'
; *** rtl_433_ESP Options ***
  '-DRTL433_ONBOARD_LED=13'           ; LED_D4
;  '-DRF_MODULE_FREQUENCY=915.00'
  '-DRTL433_OOK_MODULATION=true'      ; False is FSK, True is OOK
  '-DRTL433_ALL_DECODER_VERBOSE=4'              ; rtl_433 verbose mode
;  '-DRTL433_DECODER_VERBOSE=58'          ; LaCrosse TX141-Bv2, TX141TH-Bv2, TX141-Bv3, TX141W, TX145wsdth sensor
;  '-DRTL433_RAW_SIGNAL_DEBUG'   ; display raw received messages
;  '-DRTL433_MEMORY_DEBUG'   ; display memory usage information
  '-DRTL433_DEMOD_DEBUG'  ; display signal debug info
	'-DRTL433_MY_DEVICES=TBD'		; subset of devices
;  '-DRTL433_PUBLISH_UNPARSED'   ; publish unparsed signal details
  '-DRTL433_RSSI_THRESHOLD=-82'
;  '-DRTL433_RSSI_THRESHOLD_DELTA=12'         ; Apply a delta of 12 to average RSSI level
;  '-DRTL433_SIGNAL_RSSI'             ; Display during signal receive
;  '-DRTL433_OOK_MODULATION=false'       ; False is FSK, True is OOK
; *** RF Module Options ***
  '-DRTL433_RF_CC1101="CC1101"'  ; CC1101 Transceiver Module
;  '-DRTL433_RF_MODULE_CS=7'      ; pin to be used as chip select
  '-DRTL433_RF_MODULE_GDO0=11'   ; CC1101 pin GDO0
  '-DRTL433_RF_MODULE_GDO2=6'    ; CC1101 pin GDO2
  '-DRTL433_RF_MODULE_INIT_STATUS'    ; Display transceiver config during startup
; *** RadioLib Options ***
;  '-DRADIOLIB_DEBUG=true'
;  '-DRADIOLIB_VERBOSE=true'
; *** FSK Setting Testing ***
;  '-DsetBitrate'
;  '-DsetFreqDev'
;  '-DsetRxBW'

upload_protocol = esptool
monitor_speed = 921600

[env:esp32_cc1101]
board = esp32dev
build_flags = 
  '-DLOG_LEVEL=LOG_LEVEL_TRACE'
; *** rtl_433_ESP Options ***
;  '-DRTL433_ONBOARD_LED=2'          ; My ESP32 board had this wiring
  '-DRTL433_OOK_MODULATION=true'       ; False is FSK, True is OOK
  '-DRTL433_OOK_MODULATION=false'       ; False is FSK, True is OOK
  '-DRTL433_ALL_DECODER_VERBOSE=4'           ; rtl_433 verbose mode
;  '-DRTL433_DECODER_VERBOSE=58'          ; LaCrosse TX141-Bv2, TX141TH-Bv2, TX141-Bv3, TX141W, TX145wsdth sensor
